<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科技情報閱讀室｜每日科技日報</title>
  <meta name="description" content="科技情報閱讀室：每天整理全球科技與半導體新聞，先看 5 大焦點，再依領域往下讀，每則都附原始報導來源。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <div id="app" class="site-wrapper">
    <header class="site-topbar">
      <div class="topbar-container">
        <a class="wordmark" href="./">科技情報閱讀室</a>
        <nav class="site-nav" aria-label="刊物">
          <a class="site-nav-link" href="./brief.html">早晨總結</a>
          <a class="site-nav-link" href="./" aria-current="page">科技日報</a>
          <a class="site-nav-link" href="https://tw-radar-site.pages.dev/">台股雷達</a>
          <a class="site-nav-link" href="./about.html">介紹</a>
        </nav>
        <button id="theme-toggle" class="control-btn" type="button" aria-label="切換亮色或暗色">
          <svg class="theme-icon light-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg class="theme-icon dark-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </header>

    <main id="main" class="main-content">
      <section class="intro-block" aria-labelledby="page-title">
        <p class="intro-caption"><span id="header-date" class="date-badge">載入中</span></p>
        <h1 id="page-title" class="brand-title">今日科技情報精選</h1>
        <p id="header-meta" class="meta-strip">載入情報中…</p>

        <div class="search-bar-row">
          <div class="field">
            <label class="field-label" for="search-input">搜尋這一期</label>
            <div class="search-input-wrapper">
              <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
              <input type="text" id="search-input" placeholder="晶片、模型、公司名稱（按 / 開始搜尋）" autocomplete="off">
              <button id="search-clear" class="search-clear-btn" type="button" style="display: none;" aria-label="清除搜尋">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="date-select">切換日期</label>
            <select id="date-select" class="control-select">
              <option value="latest">最新一期</option>
            </select>
          </div>
          <button id="toggle-all-btn" class="action-btn" type="button">展開全部</button>
        </div>
      </section>

      <section id="highlights-section" class="highlights-section" aria-labelledby="highlights-title">
        <div class="section-header">
          <h2 id="highlights-title" class="section-title">今日 5 大焦點</h2>
          <span class="section-desc">今天對產業影響最大的事，建議先讀</span>
        </div>
        <div id="highlights-grid" class="highlights-grid">
          <div class="loading-card">正在載入今日焦點…</div>
        </div>
      </section>

      <nav id="category-nav" class="category-nav" aria-label="依領域篩選">
        <div class="category-nav-inner">
          <button class="cat-tab active" data-category="all">
            全部 <span class="cat-count" id="count-all">0</span>
          </button>
          <button class="cat-tab" data-category="ai_research">
            <svg class="cat-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>
            AI／模型 <span class="cat-count" id="count-ai_research">0</span>
          </button>
          <button class="cat-tab" data-category="semiconductor_hardware">
            <svg class="cat-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            半導體／硬體 <span class="cat-count" id="count-semiconductor_hardware">0</span>
          </button>
          <button class="cat-tab" data-category="software_cloud">
            <svg class="cat-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
            軟體／雲端 <span class="cat-count" id="count-software_cloud">0</span>
          </button>
          <button class="cat-tab" data-category="business_market">
            <svg class="cat-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m23 6-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>
            市場與產業 <span class="cat-count" id="count-business_market">0</span>
          </button>
          <button class="cat-tab" data-category="security">
            <svg class="cat-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            資安 <span class="cat-count" id="count-security">0</span>
          </button>
          <button class="cat-tab" data-category="deep_reads">
            <svg class="cat-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            深度閱讀 <span class="cat-count" id="count-deep_reads">0</span>
          </button>
        </div>
      </nav>

      <section id="events-stream" class="events-stream" aria-label="各領域主題">
        <div id="events-container" class="events-container"></div>
        <div id="empty-results" class="empty-results" style="display: none;">
          <svg class="empty-svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <p class="empty-title">找不到符合的主題</p>
          <p class="empty-subtitle">請換個關鍵字，或切回「全部」再找一次。</p>
        </div>
      </section>

      <section id="deep-reads-section" class="deep-reads-section" aria-labelledby="deep-reads-title">
        <div class="section-header">
          <h2 id="deep-reads-title" class="section-title">今天值得打開來讀的長文</h2>
          <span class="section-desc">有長期參考價值的深度文章與技術解析</span>
        </div>
        <div id="deep-reads-grid" class="deep-reads-grid"></div>
      </section>

      <section id="quality-section" class="quality-section" aria-labelledby="quality-title">
        <div class="quality-card">
          <div class="quality-header">
            <h2 id="quality-title" class="quality-title">這一期的資料狀態</h2>
          </div>
          <dl id="quality-grid" class="quality-grid">
            <div class="quality-item">
              <dt class="quality-label">產生時間</dt>
              <dd id="stat-generated-at" class="quality-value">-</dd>
            </div>
            <div class="quality-item">
              <dt class="quality-label">分析模型</dt>
              <dd id="stat-model" class="quality-value">-</dd>
            </div>
            <div class="quality-item">
              <dt class="quality-label">掃描文章</dt>
              <dd id="stat-scanned" class="quality-value">-</dd>
            </div>
            <div class="quality-item">
              <dt class="quality-label">有效來源</dt>
              <dd id="stat-sources" class="quality-value">-</dd>
            </div>
            <div class="quality-item">
              <dt class="quality-label">獨立主題</dt>
              <dd id="stat-topics" class="quality-value">-</dd>
            </div>
            <div class="quality-item">
              <dt class="quality-label">背景舊文標記</dt>
              <dd id="stat-stale" class="quality-value">-</dd>
            </div>
          </dl>
          <p class="quality-footer">同一篇報導只收錄一次，每篇文章都標註擷取品質。</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <p class="footer-copy">科技情報閱讀室｜由 news-rss 每天自動整理，摘要以原始報導為準</p>
        <p class="footer-shortcuts">快捷鍵：<kbd>/</kbd> 搜尋｜<kbd>Esc</kbd> 收合或清除</p>
      </div>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
